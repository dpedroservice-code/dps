<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — D.PEDRO SOLUÇÕES</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:system-ui,sans-serif; background:linear-gradient(135deg,#1e3a8a,#0f172a); color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .card { text-align:center; max-width:420px; padding:40px; background:rgba(255,255,255,.08); backdrop-filter:blur(10px); border-radius:20px; border:1px solid rgba(255,255,255,.15); }
        .icon { font-size:4rem; margin-bottom:16px; }
        h1 { font-size:1.5rem; margin-bottom:12px; }
        p { opacity:.8; line-height:1.6; margin-bottom:24px; }
        button { background:#10b981; color:#fff; border:none; padding:14px 28px; border-radius:10px; font-weight:700; font-size:1rem; cursor:pointer; }
        button:hover { background:#059669; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Sem conexão</h1>
        <p>Não foi possível contactar o servidor. Verifica a tua ligação à internet.</p>
        <button onclick="window.location.reload()">🔄 Tentar novamente</button>
    </div>
</body>
</html>
