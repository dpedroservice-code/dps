<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recuperar palavra-passe</title><style>body{font:16px system-ui;background:#f3f6fa;margin:0;color:#172033}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:white;padding:32px;border-radius:18px;width:min(100%,440px);box-shadow:0 15px 45px #10233b18}label{display:block;margin:16px 0 7px;font-weight:650}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd5e0;border-radius:9px;font:inherit}button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:9px;background:#1769aa;color:white;font-weight:700}a{color:#1769aa}.error{color:#b42318}.success{color:#067647}</style></head><body><main class="wrap"><section class="card"><h1>Recuperar acesso</h1><p>Indique o e-mail associado à conta. Enviaremos uma ligação segura para definir uma nova palavra-passe.</p><form id="f"><label>E-mail</label><input id="email" type="email" required autocomplete="email"><button>Enviar ligação de recuperação</button></form><p id="msg" role="status"></p><a href="login.html">Voltar ao login</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/auth.js"></script><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('msg');try{await DPAuth.requestPasswordReset(document.getElementById('email').value);m.textContent='Se o endereço estiver registado, receberá uma ligação de recuperação.';m.className='success';}catch(x){m.textContent=x.message;m.className='error';}});</script></body></html>
