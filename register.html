<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Criar conta — D.PEDRO SOLUÇÕES</title><link rel="stylesheet" href="assets/css/style.css">
<style>
body{margin:0;background:#f3f6fa;font:16px system-ui;color:#172033}.wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(100%,480px);background:white;padding:32px;border-radius:18px;box-shadow:0 15px 45px #10233b18}.card h1{margin:8px 0}.card p{color:#64748b;line-height:1.5}label{display:block;font-weight:650;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd5e0;border-radius:9px;font:inherit}button{width:100%;margin-top:16px;padding:14px;background:#1769aa;color:white;border:0;border-radius:9px;font-weight:700}a{color:#1769aa}.msg{margin-top:14px}.error{color:#b42318}.success{color:#067647}[hidden]{display:none!important}
</style></head><body><main class="wrap"><section class="card"><strong>D.PEDRO SOLUÇÕES</strong><h1>Criar conta</h1><p>Confirme o seu e-mail com o código de seis dígitos que enviaremos.</p>
<form id="registerForm"><label>Nome completo</label><input id="name" required minlength="2" autocomplete="name"><label>E-mail</label><input id="email" type="email" required autocomplete="email"><label>Palavra-passe</label><input id="password" type="password" required minlength="10" autocomplete="new-password"><small>Use pelo menos 10 caracteres.</small><button id="registerBtn">Criar conta e enviar código</button></form>
<form id="verifyForm" hidden><label>Código de confirmação</label><input id="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autocomplete="one-time-code"><button>Confirmar e ativar conta</button><button type="button" id="resend" style="background:#526579">Reenviar código</button></form>
<div id="msg" class="msg" role="status" aria-live="polite"></div><p><a href="login.html">Já tenho conta</a> · <a href="index.html">Voltar ao site</a></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/auth.js"></script>
<script>
const $=id=>document.getElementById(id);function note(t,c=''){ $('msg').textContent=t;$('msg').className='msg '+c;}
$('registerForm').addEventListener('submit',async e=>{e.preventDefault();$('registerBtn').disabled=true;try{await DPAuth.register({name:$('name').value,email:$('email').value,password:$('password').value});$('registerForm').hidden=true;$('verifyForm').hidden=false;note('Conta criada. Introduza o código enviado para o seu e-mail.','success');}catch(err){note(err.message,'error');}finally{$('registerBtn').disabled=false;}});
$('verifyForm').addEventListener('submit',async e=>{e.preventDefault();try{await DPAuth.verifyRegistrationCode($('email').value,$('otp').value);location.replace('index.html');}catch(err){note(err.message,'error');}});
$('resend').addEventListener('click',async()=>{try{await DPAuth.resendRegistrationCode($('email').value);note('Novo código enviado.','success');}catch(err){note(err.message,'error');}});
</script></body></html>
